{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Meta -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Title -->
    <title>{% block title %}Nagunuri Sai | Portfolio{% endblock %}</title>

    <!-- Favicon (Optional) -->
    <!-- <link rel="icon" href="{% static 'student/images/favicon.png' %}"> -->

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- AOS Animation -->
    <link rel="stylesheet"
          href="https://unpkg.com/aos@2.3.4/dist/aos.css">

    <!-- Main CSS -->
    <link rel="stylesheet"
          href="{% static 'student/css/style.css' %}">

</head>

<body>

    <!-- Navbar -->
    {% include 'student/includes/navbar.html' %}

    <!-- Main Content -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    {% include 'student/includes/footer.html' %}

    <!-- AOS JS -->
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

    <script>
        AOS.init({
            duration: 1000,
            once: true,
            offset: 80
        });
    </script>

    <!-- Main JS -->
    <script src="{% static 'student/js/script.js' %}"></script>

</body>

</html>
